<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#16483b"><title>Casa Valdarno · Affitti</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ed;color:#20382f;font:16px/1.5 system-ui,sans-serif}main,header>div{width:min(960px,92%);margin:auto}header{background:#16483b;color:#fff;padding:26px 0 34px}header a{color:#d7e9d7}h1,h2,h3{line-height:1.14}h1{font:clamp(40px,7vw,72px)/1.1 Georgia,serif;margin:24px 0 5px}header p{margin:0;color:#e2ede4}.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 0}select,button{font:inherit;padding:8px;border-radius:8px;border:1px solid #aaa;background:white;color:inherit}input{accent-color:#16483b}#homes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:15px}article,details{background:#fff;border:1px solid #d6dbcf;border-radius:14px;padding:20px}article{display:flex;flex-direction:column}h3{margin:6px 0;font:26px/1.14 Georgia,serif}article b{font-size:21px}small{color:#526358}article p{margin:8px 0}article a{margin-top:auto;padding-top:14px;font-weight:650}a{color:#12543e}details{margin:18px 0 36px}summary{cursor:pointer;font-weight:650}#count{font-size:15px}footer{margin:24px 0}a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c57d21}
</style><header><div><a href="/Marco-hub/">‹ Marco-Hub</a><h1>Casa Valdarno</h1><p>Affitti fino a 700 € al mese · priorità a Figline, Incisa e Matassino</p></div></header>
<main><div class="controls"><label>Zona <select id="zone"><option value="">Tutto il Valdarno</option></select></label><label><input type="checkbox" id="garage"> Con garage</label><label><input type="checkbox" id="privateOwner"> Da privati</label></div>
<h2>Case in affitto</h2><p id="count" role="status">Caricamento degli annunci…</p><section id="homes"></section><details><summary>Fonti dell’ultima ricerca</summary><ul id="sources"></ul></details>
<footer><a id="search" href="https://www.google.it/search?q=affitto+appartamento+Valdarno+entro+700+euro+-transitorio">Cerca altri annunci sul web ↗</a></footer></main>
<script type="module">
const get = id => document.getElementById(id);
const element = (tag, text) => { const node = document.createElement(tag); node.textContent = text; return node; };
async function start() {
 const response = await fetch('./affitti.json', {cache:'no-store'});
 if (!response.ok) throw Error('Catalogo indisponibile');
 const data = await response.json();
 const catalog = data.homes.filter(h => h.rent > 0 && h.rent <= 700 && !/transitor/i.test(h.contract));
 for (const zone of new Set(catalog.map(h => h.zone))) get('zone').add(new Option(zone, zone));
 for (const [name,result] of Object.entries(data.sources)) get('sources').append(element('li',name+' · '+result));
 function render() {
  const selected = catalog.filter(h => (!get('zone').value || h.zone === get('zone').value) && (!get('garage').checked || h.garage) && (!get('privateOwner').checked || h.privateOwner)).sort((a,b)=>a.rent-b.rent);
  get('count').textContent = selected.length+' annunci · Ricerca del '+data.updated.split('-').reverse().join('/');
  get('homes').replaceChildren();
  if (!selected.length) get('homes').append(element('p','Nessuna casa con questi filtri.'));
  for (const h of selected) {
   const url = new URL(h.url); if (url.protocol !== 'https:') continue;
   const card = element('article',''), link = element('a','Apri annuncio ↗'); link.href = url.href; link.target = '_blank'; link.rel = 'noopener';
   card.append(element('small',h.zone+' · '+(h.privateOwner?'Privato':'Agenzia')),element('h3',h.title),element('b',h.rent+' €/mese'),element('p',h.area+' m² · '+h.contract),element('strong',h.parking),element('p',h.note),element('small',url.hostname.replace(/^www\./,'')),link);
   get('homes').append(card);
  }
 }
 document.querySelector('.controls').addEventListener('change',render); render();
}
start().catch(()=>get('count').textContent='Il catalogo non è disponibile. Ricarica la pagina per riprovare.');
</script></html>
