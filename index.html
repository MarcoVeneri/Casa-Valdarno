<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Casa Valdarno · Affitti</title>
<style>
:root{color-scheme:light;--ink:#1e302c;--accent:#216955;--line:#e0e7e2;--paper:#f6f8f5}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main,header>div{width:min(1080px,calc(100% - 48px));margin:auto}
header{background:#fff;border-bottom:1px solid var(--line);padding:8px 0 22px}
header a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:600;display:inline-flex;align-items:center;min-height:44px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(2rem,4vw,3.25rem);letter-spacing:-.05em;line-height:1.08;font-weight:730;margin:2px 0 7px}
header p{font-size:.96rem;color:#506158}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px}main>.controls{padding:18px 0;border-bottom:1px solid var(--line)}label{font-weight:600;font-size:.9rem}
input,select,button{font:inherit;color:inherit}select,#town,button{min-height:44px;border-radius:13px;padding:8px 12px;border:1px solid #cdd9d0;background:white}
main>.controls label{display:flex;align-items:center;gap:7px}main>.controls label:has(input){border:1px solid #cdd9d0;border-radius:24px;padding:9px 15px;min-height:44px;background:white;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}main>.controls label:has(:checked){background:#def0e5;border-color:#89b69f}
.results-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:28px 0 16px}h2{font-size:1.55rem;letter-spacing:-.045em}#count,small{font-size:.84rem;color:#506158}
#homes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}article,footer,details{border:1px solid var(--line);background:white;border-radius:22px}
article{padding:22px;display:flex;flex-direction:column;align-items:flex-start;box-shadow:0 5px 20px #1d382308;min-width:0}article small:first-child{font-weight:700;color:#376956}h3{font-size:1.25rem;letter-spacing:-.035em;line-height:1.22;margin:9px 0}
article b{font-size:2.05rem;letter-spacing:-.055em;line-height:1.3}article b span{font-size:.86rem;font-weight:500;color:#596b61;letter-spacing:0;margin-left:4px}
article p{margin:6px 0 10px;color:#46564e}article strong{background:#edf3e9;color:#36543b;border-radius:9px;padding:4px 9px;font-size:.83rem}
.card-foot{width:100%;margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.card-foot a,button{font-weight:650;color:white;background:#215b49;border:0;border-radius:13px;padding:11px 13px;text-decoration:none;font-size:.88rem;cursor:pointer}
details,footer{padding:18px 22px;margin:18px 0}summary{cursor:pointer;font-weight:650}li{margin:5px 0}footer{margin-bottom:40px}footer .controls{margin-top:12px}footer label{display:grid;gap:3px}footer button{align-self:flex-end}
:focus-visible{outline:3px solid #bd782e;outline-offset:3px}
@media(max-width:640px){main,header>div{width:calc(100% - 32px)}header{padding:0 0 15px}header p{font-size:.88rem}main>.controls{gap:8px}main>.controls label:first-child{width:100%}#zone{flex:1}article{padding:18px}.results-head{margin-top:20px}footer .controls{align-items:stretch}footer label{flex:1;min-width:120px}#town,#portal{width:100%}footer button{width:100%}}
.portal-links,.other-links{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.portal-links a,.other-links a{color:var(--accent);font-weight:600;padding:7px 0}.other-links{font-size:.85rem}.portal-links{margin:0 0 16px}
.gallery{position:relative;width:calc(100% + 44px);margin:-22px -22px 16px;aspect-ratio:16/10;background:#e9eeeb;border-radius:21px 21px 0 0;overflow:hidden;display:grid;place-items:center;color:#506158}.gallery img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;position:absolute;inset:0}.gallery button{position:absolute;top:50%;transform:translateY(-50%);background:#fff;color:#21362c;border-radius:50%;width:38px;height:38px;padding:0;min-height:0;font-size:24px}.gallery .prev{left:9px}.gallery .next{right:9px}.photo-count{position:absolute;bottom:9px;right:9px;background:#000a;color:white;padding:3px 9px;border-radius:12px;font-size:12px}dialog{border:0;background:#141414;color:white;padding:12px;width:min(96vw,1100px);border-radius:16px}dialog::backdrop{background:#000b}dialog img{width:100%;max-height:78vh;object-fit:contain}dialog nav{display:flex;justify-content:space-between;align-items:center}@media(max-width:640px){.gallery{width:calc(100% + 36px);margin:-18px -18px 14px}} 
</style><header><div><a href="/Marco-hub/">‹ Marco-Hub</a><h1>Casa Valdarno</h1><p>Affitti in Valdarno · in ordine di prezzo</p></div></header>
<main><div class="controls"><label>Zona <select id="zone"><option value="">Tutto il Valdarno</option></select></label><label><input type="checkbox" id="garage"> Con garage</label><label><input type="checkbox" id="privateOwner"> Da privati</label></div>
<div class="results-head"><h2>Case in affitto</h2><p id="count" role="status">Caricamento degli annunci…</p></div><nav class="portal-links" aria-label="Tutti gli affitti a Figline e Incisa"><a href="https://www.idealista.it/affitto-case/figline-e-incisa-valdarno-firenze/?ordine=prezzi-asc">Figline e Incisa su idealista ↗</a><a href="https://www.immobiliare.it/affitto-appartamenti/figline-e-incisa-valdarno/">Figline e Incisa su Immobiliare.it ↗</a></nav><section id="homes"></section><details><summary>Fonti dell’ultima ricerca</summary><ul id="sources"></ul></details>
<footer><h2>Cerca sui portali</h2><form id="webSearch" class="controls" action="https://www.google.it/search" target="_blank" rel="noopener"><label>Località <input id="town" value="Valdarno" required maxlength="80"></label><label>Fonte <select id="portal"><option value="">Tutto il web</option></select></label><input type="hidden" name="q" id="query"><button>Cerca annunci ↗</button></form></footer></main>
<script type="module">
const get = id => document.getElementById(id);
const element = (tag, text) => { const node = document.createElement(tag); node.textContent = text; return node; };
const portals = {'Immobiliare.it':'immobiliare.it','Casa.it':'casa.it','idealista':'idealista.it','Subito':'subito.it','Wikicasa':'wikicasa.it','Bakeca':'bakeca.it','CasaDaPrivato':'casadaprivato.it','Facebook pubblico':'facebook.com','Tecnocasa':'tecnocasa.it','RE/MAX':'remax.it','Trovacasa':'trovacasa.it','Mitula':'mitula.it'};
for (const [name,domain] of Object.entries(portals)) get('portal').add(new Option(name,domain));
get('webSearch').addEventListener('submit',()=>{
 const domain = get('portal').value;
 get('query').value = [domain && 'site:'+domain,'appartamento affitto',get('town').value,'-transitorio','-stagionale','-vacanze'].filter(Boolean).join(' ');
});
function gallery(h){
 const box=element('div','');box.className='gallery';
 const photos=[...new Set([...(Array.isArray(h.photos)?h.photos:[]),h.image].filter(x=>typeof x==='string' && /^https:\/\//i.test(x)))];
 if(!photos.length){box.append(element('span','Foto non disponibili'));return box;}
 const img=document.createElement('img');img.alt=h.title;img.loading='lazy';img.referrerPolicy='no-referrer';
 const count=element('span','');count.className='photo-count';let i=0;
 const show=()=>{img.src=photos[i];count.textContent=(i+1)+' / '+photos.length;};
 const step=d=>{i=(i+d+photos.length)%photos.length;show();};
 const button=(t,c,fn)=>{const b=element('button',t);b.type='button';b.className=c;b.setAttribute('aria-label',c==='prev'?'Foto precedente':'Foto successiva');b.onclick=fn;return b;};
 box.append(img,count);if(photos.length>1)box.append(button('‹','prev',()=>step(-1)),button('›','next',()=>step(1)));
 let x=0;box.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});box.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>35)step(d<0?1:-1);},{passive:true});
 img.onerror=()=>{photos.splice(i,1);if(!photos.length){box.replaceChildren(element('span','Foto non disponibili'));return;}i%=photos.length;show();};
 img.onclick=()=>{const d=document.createElement('dialog'),big=document.createElement('img'),nav=document.createElement('nav');big.alt=h.title;big.referrerPolicy='no-referrer';const refresh=()=>big.src=photos[i];const move=n=>{step(n);refresh();};const close=element('button','Chiudi ×');close.onclick=()=>d.close();nav.append(button('‹','prev',()=>move(-1)),close,button('›','next',()=>move(1)));d.append(big,nav);document.body.append(d);d.addEventListener('close',()=>d.remove());d.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});refresh();d.showModal();};show();return box;
}
async function start() {
 let response;
 try {
  response = await fetch('https://raw.githubusercontent.com/MarcoVeneri/Casa-Valdarno/main/affitti.json',{cache:'no-store',signal:AbortSignal.timeout(6000)});
  if (!response.ok) throw Error('Catalogo remoto indisponibile');
 } catch {
  response = await fetch('./affitti.json',{cache:'no-store'});
 }
 if (!response.ok) throw Error('Catalogo indisponibile');
 const data = await response.json();
 let checks;
 for (const file of ['https://raw.githubusercontent.com/MarcoVeneri/Casa-Valdarno/main/verifiche.json','./verifiche.json']) {
  try {
   const res = await fetch(file,{cache:'no-store',signal:AbortSignal.timeout(6000)});
   if (!res.ok) continue;
   const result = await res.json();
   if (!result.urls || !Number.isFinite(Date.parse(result.date))) continue;
   checks = result;
   break;
  } catch {}
 }
 if (!checks || Date.now()-Date.parse(checks.date)>3*86400000) {
  get('count').textContent='Verifiche da aggiornare. Consulta gli annunci direttamente sui portali.';
  return;
 }
 const recentCheck = url => checks.urls[url] === 'unverified' && Date.now()-Date.parse(checks.lastConfirmed?.[url]) < 2*86400000;
 const verifiedHomes = data.homes.flatMap(home => {
  const links = [home.url,...(home.links || [])].filter(url=>checks.urls[url]==='detail' || recentCheck(url));
  return links.length ? [{...home,url:links[0],links:links.slice(1)}] : [];
 });
 const catalog = verifiedHomes.filter(h => h.rent > 0 && !/transitor/i.test(h.contract));
 const comune = 'Figline e Incisa Valdarno';
 get('zone').add(new Option(comune+' · tutto il comune', comune));
 for (const zone of new Set(catalog.map(h => h.zone))) get('zone').add(new Option(zone, zone));
 for (const [name,result] of Object.entries(data.sources)) get('sources').append(element('li',name+' · '+result));
 function render() {
  const selected = catalog.filter(h => (!get('zone').value || h.zone === get('zone').value || h.municipality === get('zone').value) && (!get('garage').checked || h.garage) && (!get('privateOwner').checked || h.privateOwner)).sort((a,b)=>a.rent-b.rent);
  get('count').textContent = selected.length+(selected.length === 1 ? ' annuncio' : ' annunci')+' · Ultimo controllo del '+checks.date.split('-').reverse().join('/');
  get('homes').replaceChildren();
  if (!selected.length) get('homes').append(element('p',catalog.length ? 'Nessuna casa con questi filtri.' : 'Nessuna scheda confermata nell’ultimo controllo. Consulta i portali qui sopra.'));
  for (const h of selected) {
   const url = new URL(h.url); if (url.protocol !== 'https:') continue;
   const card = element('article',''), link = element('a','Apri annuncio ↗'); link.href = url.href; link.target = '_blank'; link.rel = 'noopener';
   const price = element("b",h.rent+" €");
   price.append(element("span","/ mese"));
   const foot = element("div",""); foot.className = "card-foot";
   foot.append(element("small",url.hostname.replace(/^www\./,"")),link);
   card.append(gallery(h),element('small',h.zone+' · '+(h.privateOwner === true ? 'Privato' : h.privateOwner === false ? 'Agenzia' : 'Annuncio')),element('h3',h.title),price,element('p',h.area+' m² · '+h.contract),element('strong',h.parking),element('p',h.note),foot);
   if ([h.url,...h.links].some(recentCheck)) card.append(element('small','Alcuni link risultavano aperti nelle ultime 48 ore. L’ultimo controllo non ha potuto riconfermarli.'));
   if (h.links.length) {
    const others = element('div',''); others.className = 'other-links';
    for (const address of h.links) {
     const other = new URL(address); if(other.protocol !== 'https:') continue;
     const anchor = element('a',other.hostname.replace(/^www\./,'')+' ↗');
     anchor.href = other.href; anchor.rel = 'noopener'; anchor.target = '_blank'; others.append(anchor);
    }
    card.append(others);
   }
   get('homes').append(card);
  }
 }
 document.querySelector('.controls').addEventListener('change',render); render();
}
start().catch(()=>get('count').textContent='Il catalogo non è disponibile. Ricarica la pagina per riprovare.');
</script></html>
